<!DOCTYPE html>
<html lang="{{ language }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% if language == 'zh' %}核验成功 | Pharma New Zealand{% else %}Verification Successful | Pharma New Zealand{% endif %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .image-wrapper {
            width: 100%;
            max-width: 500px;
            background-color: #ffffff;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        .fullscreen-image {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        @media (max-width: 500px) {
            body {
                background-color: #ffffff;
            }
            .image-wrapper {
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="image-wrapper">
        <!-- 把下面的图片文件名改成你success页面的图片文件名 -->
        <img src="/static/images/success.jpg"
             alt="Authentic Product Confirmed"
             class="fullscreen-image">
    </div>
</body>
</html>

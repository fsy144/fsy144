<!DOCTYPE html>
<html lang="{{ language }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% if language == 'zh' %}安全警告 | Pharma New Zealand{% else %}Security Warning | Pharma New Zealand{% endif %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background-color: #f5f5f5; /* 电脑端背景色，衬托图片 */
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .image-wrapper {
            width: 100%;
            max-width: 500px; /* 电脑端最大宽度，模拟手机宽度 */
            background-color: #ffffff;
            box-shadow: 0 0 20px rgba(0,0,0,0.05); /* 电脑端轻微阴影，更有质感 */
        }

        .fullscreen-image {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        /* 手机端优化 */
        @media (max-width: 500px) {
            body {
                background-color: #ffffff; /* 手机端背景和图片一致，无缝衔接 */
            }
            .image-wrapper {
                box-shadow: none; /* 手机端去掉阴影 */
            }
        }
    </style>
</head>
<body>
    <div class="image-wrapper">
        <img src="/static/images/warning.jpg"
             alt="This code has already been scanned"
             class="fullscreen-image">
    </div>
</body>
</html>
